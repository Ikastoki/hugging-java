<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="600" height="150" role="img" aria-label="Java - Hugging Java">
  <defs>
    <!-- Cielo diurno/atardecer suave -->
    <linearGradient id="cielo-hopper-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#f5e6d0"/>
      <stop offset="0.5" stop-color="#e8d4b0"/>
      <stop offset="1"   stop-color="#d4b888"/>
    </linearGradient>
    <!-- Luz interior de la cafetería (tonos cálidos más suaves) -->
    <linearGradient id="luz-interior-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#fff5dc"/>
      <stop offset="0.5" stop-color="#f5e0a8"/>
      <stop offset="1"   stop-color="#e8c880"/>
    </linearGradient>
    <!-- Resplandor sobre la acera -->
    <radialGradient id="resplandor-calle-light" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c5a030" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#c5a030" stop-opacity="0"/>
    </radialGradient>
    <!-- Reflejo en el cristal -->
    <linearGradient id="reflejo-cristal-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
    <clipPath id="marco-hopper-light">
      <rect width="600" height="150" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#marco-hopper-light)">
    <!-- Cielo diurno -->
    <rect width="600" height="150" fill="url(#cielo-hopper-light)"/>

    <!-- Acera (suelo claro) -->
    <rect y="120" width="600" height="30" fill="#c9a878"/>
    <line x1="0" y1="120" x2="600" y2="120" stroke="#a68550" stroke-width="0.5" opacity="0.7"/>

    <!-- Edificio de la izquierda (tonos suaves) -->
    <rect x="0" y="0" width="110" height="150" fill="#a67c52"/>
    <!-- Ventanas oscuras del edificio izquierdo -->
    <rect x="20" y="55" width="30" height="40" fill="#6b4f2e" opacity="0.7"/>
    <rect x="65" y="55" width="30" height="40" fill="#6b4f2e" opacity="0.7"/>
    <!-- Cornisa -->
    <line x1="0" y1="45" x2="110" y2="45" stroke="#8b6f47" stroke-width="1"/>

    <!-- Edificio de la derecha -->
    <rect x="490" y="0" width="110" height="150" fill="#a67c52"/>
    <!-- Ventanas oscuras del edificio derecho -->
    <rect x="505" y="55" width="30" height="40" fill="#6b4f2e" opacity="0.7"/>
    <rect x="550" y="55" width="30" height="40" fill="#6b4f2e" opacity="0.7"/>
    <line x1="490" y1="45" x2="600" y2="45" stroke="#8b6f47" stroke-width="1"/>

    <!-- Resplandor sobre la acera -->
    <ellipse cx="300" cy="130" rx="200" ry="25" fill="url(#resplandor-calle-light)"/>

    <!-- Marco exterior del ventanal -->
    <path d="M110,40 L490,40 L490,130 L110,130 Z" fill="#8b6f47"/>

    <!-- Cristal con luz interior -->
    <path d="M118,48 L482,48 L482,125 L118,125 Z" fill="url(#luz-interior-light)"/>

    <!-- Pared trasera interior -->
    <rect x="118" y="48" width="364" height="25" fill="#d4b078" opacity="0.7"/>

    <!-- Mostrador/barra -->
    <path d="M118,95 L482,95 L482,125 L118,125 Z" fill="#b8944a" opacity="0.85"/>
    <line x1="118" y1="95" x2="482" y2="95" stroke="#c5a030" stroke-width="1.2"/>

    <!-- SILUETAS DE PERSONAS (tonos marrones más suaves) -->
    <!-- Camarero -->
    <g fill="#6b4f2e" opacity="0.85">
      <circle cx="220" cy="68" r="5"/>
      <path d="M214,64 Q220,58 226,64 L226,66 L214,66 Z" fill="#f5e6c8"/>
      <path d="M213,73 L227,73 L229,95 L211,95 Z" fill="#f5e6c8"/>
    </g>

    <!-- Cliente 1: hombre con sombrero -->
    <g fill="#5a4020" opacity="0.9">
      <circle cx="300" cy="78" r="5.5"/>
      <path d="M292,75 L308,75 L306,72 L294,72 Z" fill="#3d2817"/>
      <path d="M291,83 L309,83 L312,125 L288,125 Z"/>
    </g>

    <!-- Cliente 2: pareja -->
    <g fill="#5a4020" opacity="0.9">
      <circle cx="370" cy="80" r="5"/>
      <path d="M362,85 L378,85 L380,125 L360,125 Z"/>
      <circle cx="395" cy="82" r="4.5"/>
      <path d="M388,87 L402,87 L404,125 L386,125 Z"/>
    </g>

    <!-- Tazas de café -->
    <g fill="#8b6f47" opacity="0.8">
      <ellipse cx="260" cy="93" rx="3" ry="1"/>
      <rect x="258" y="89" width="4" height="4" rx="0.5"/>
      <ellipse cx="340" cy="93" rx="3" ry="1"/>
      <rect x="338" y="89" width="4" height="4" rx="0.5"/>
    </g>

    <!-- Reflejo en el cristal -->
    <path d="M118,48 L482,48 L482,125 L118,125 Z" fill="url(#reflejo-cristal-light)"/>

    <!-- Marco del ventanal -->
    <path d="M118,48 L482,48 L482,125 L118,125 Z" fill="none" stroke="#3d2817" stroke-width="2"/>
    <line x1="235" y1="48" x2="235" y2="125" stroke="#3d2817" stroke-width="1.5" opacity="0.7"/>
    <line x1="365" y1="48" x2="365" y2="125" stroke="#3d2817" stroke-width="1.5" opacity="0.7"/>

    <!-- CARTEL "JAVA" -->
    <rect x="240" y="10" width="120" height="28" rx="2" fill="#a83828" opacity="0.95"/>
    <rect x="240" y="10" width="120" height="28" rx="2" fill="none" stroke="#c5a030" stroke-width="1" opacity="0.8"/>
    <text x="300" y="30" text-anchor="middle"
          font-family="'Georgia', 'Times New Roman', serif"
          font-size="18" font-weight="700" letter-spacing="4" fill="#fff5dc">JAVA</text>

    <!-- SUBTÍTULO "Hugging Java" -->
    <text x="300" y="145" text-anchor="middle"
          font-family="'Georgia', 'Times New Roman', serif"
          font-size="10" font-style="italic" letter-spacing="2" fill="#8b6f47" opacity="0.9">Hugging Java</text>

    <!-- Farola -->
    <g opacity="0.85">
      <line x1="75" y1="120" x2="75" y2="60" stroke="#3d2817" stroke-width="1.5"/>
      <circle cx="75" cy="58" r="3" fill="#c5a030" opacity="0.6"/>
      <circle cx="75" cy="58" r="6" fill="#c5a030" opacity="0.15"/>
    </g>

    <!-- Detalles del cielo -->
    <circle cx="540" cy="20" r="0.6" fill="#ffffff" opacity="0.4"/>
    <circle cx="50" cy="15" r="0.5" fill="#ffffff" opacity="0.3"/>
  </g>

  <!-- Borde del banner -->
  <rect x="0.5" y="0.5" width="599" height="149" rx="12" fill="none" stroke="#a68550"/>
</svg>